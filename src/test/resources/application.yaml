spring:
  datasource:
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    url: jdbc:tc:postgresql:latest:///warehouse_history_test

  schedule:
    cron: "0 * * * * *"
    deadline-by-year: 5

  liquibase:
    change-log: classpath:db/changelog/db.changelog.yaml
    enabled: true
    drop-first: false
    default-schema: public